<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div id="question-box">
            <div class="gif-container">
                <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExN3ZsdTV1MW5qc2NrbmU3NnE5dWtkZzhtZDk3Nzl2OXR2MHdsa2hmMSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/6C5LFuLcnhTZeypW0E/giphy.gif" alt="Cute Bear">
            </div>
            <h1>Will you be my Valentine?🥺 👉👈</h1>
            
            <div class="buttons">
                <button id="yes-btn">Yes</button>
                <button id="no-btn">No</button>
            </div>
        </div>

        <div id="success-box" class="hidden">
            <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExN3ZsdTV1MW5qc2NrbmU3NnE5dWtkZzhtZDk3Nzl2OXR2MHdsa2hmMSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/6C5LFuLcnhTZeypW0E/giphy.gif" alt="Celebrate">
            <h1>YAY! ❤️</h1>
            <p>I knew you'd say yes!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
